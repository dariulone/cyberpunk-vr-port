# ONE PROP RECORD PER GRENADE TYPE: Items.VRPortGrenade (Items.VRPortGrenade.yaml) per kind, each pointing at its
# own prop entity. The belt (CyberpunkVRPort_TacticalBelt) cloned them at run time with TweakDB:CloneRecord; as data
# they exist from the TweakDB load. Written out from the same base rather than $base: Items.VRPortGrenade, so the
# order the files are applied in does not matter. The slot list is a whitelist the engine enforces: the belt
# (VRPortBelt6) and either hand's own grenade slot (VRPortGrenadeLeft/Right, AttachmentSlots.VRPortGrenade.yaml: main's c026279ef).

Items.VRPortGrenade_frag:
  $base: Items.cigarette_i_stick
  entityName: vrp_gren_frag
  appearanceName: default
  friendlyName: vrp_grenade
  equivalent: Items.VRPortGrenade_frag
  OnAttach: []
  OnEquip: []
  tags:
    - Prop
  placementSlots:
    - AttachmentSlots.VRPortBelt6
    - AttachmentSlots.VRPortGrenadeLeft
    - AttachmentSlots.VRPortGrenadeRight

