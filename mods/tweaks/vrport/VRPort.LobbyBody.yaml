# THE LOBBY'S BODY IS A MAN'S.
#
# The main menu's world holds a player of its own (the body the VR lobby walks in, mods/cet/CyberpunkVRPort_Lobby).
# Character.Player_Puppet_Base lists one entity per gender (inline0 the woman's, inline1 the man's); the game spawns
# the one marked `initial` when there is nothing else to go by -- the main menu, before any character exists. A
# loaded save and a new game spawn the gender they carry, so this only decides who stands in the main menu.

Character.Player_Puppet_Base_inline0:
  initial: false

Character.Player_Puppet_Base_inline1:
  initial: true
