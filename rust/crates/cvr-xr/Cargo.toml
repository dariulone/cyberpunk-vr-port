[package]
name = "cvr-xr"
description = "The port's OpenXR (stage 4, docs/rust-migration-plan.md): the instance, the system and, step by step, the session the C++ OpenXRManager hands over"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
cvr-body = { path = "../cvr-body" }
cvr-camera = { path = "../cvr-camera" }
cvr-host = { path = "../cvr-host" }
cvr-input = { path = "../cvr-input" }
red4ext-abi = { path = "../red4ext-abi" }
cvr-crt = { path = "../cvr-crt" }
cvr-gpu = { path = "../cvr-gpu" }
cvr-settings = { path = "../cvr-settings" }
openxr-sys = "0.14"
windows = { version = "0.62", features = ["Win32_Graphics_Direct3D12", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common"] }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Performance",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Environment",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[lints]
workspace = true

[features]
# The plugin's Rust build (cvr-render's rust-build): the runtime tables the C++ half used to attach are built
# here from the plugin's exports; a test program without it attaches its own.
plugin-tables = []
