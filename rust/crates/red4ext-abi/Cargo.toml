[package]
name = "red4ext-abi"
description = "Narrow, layout-checked bindings to the port's pinned RED4ext.SDK (game 2.5 fork): plugin API v1, address resolution, engine memory, CName, RTTI and script natives"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }

[lints]
workspace = true
