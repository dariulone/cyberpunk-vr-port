[package]
name = "cvr-loader"
description = "The port's own loader: bin\\x64\\powrprof.dll, a proxy of the system's powrprof.dll that loads <game>\\cyberpunkvrport\\cyberpunkvrport.dll while the game starts (RED4ext's part of the port built in)"
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"

[lib]
name = "powrprof"
crate-type = ["cdylib"]

[dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Diagnostics_Debug", "Win32_System_LibraryLoader", "Win32_System_Memory", "Win32_System_SystemInformation", "Win32_System_SystemServices", "Win32_System_Threading"] }

[lints]
workspace = true
